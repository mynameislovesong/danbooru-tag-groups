name: Assemble tag groups

on:
  push:
    paths:
      - 'parts/**'

permissions:
  contents: write

concurrency:
  group: assemble-tag-groups
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble when all parts are present
        shell: bash
        run: |
          set -euo pipefail
          count=$(find parts -maxdepth 1 -type f -name 'part*.b64' 2>/dev/null | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "Waiting for all 7 parts (currently $count)."
            exit 0
          fi
          cat $(find parts -maxdepth 1 -type f -name 'part*.b64' | sort) | base64 -d | xz -d > danbooru_tag_groups.txt
          test "$(wc -c < danbooru_tag_groups.txt)" -eq 666398
          rm -rf parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Danbooru tag groups text file'
          git push
